name: Deploy Compliance Monitor

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets into app.js
        run: |
          sed -i "s|PLACEHOLDER_FIREBASE_API_KEY|${{ secrets.FIREBASE_API_KEY }}|g" app.js
          sed -i "s|PLACEHOLDER_SENDER_ID|${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}|g" app.js
          sed -i "s|PLACEHOLDER_APP_ID|${{ secrets.FIREBASE_APP_ID }}|g" app.js
          sed -i "s|PLACEHOLDER_EMAILJS_SID|${{ secrets.EMAILJS_SERVICE_ID }}|g" app.js
          sed -i "s|PLACEHOLDER_EMAILJS_TID|${{ secrets.EMAILJS_TEMPLATE_ID }}|g" app.js
          sed -i "s|PLACEHOLDER_EMAILJS_KEY|${{ secrets.EMAILJS_PUBLIC_KEY }}|g" app.js
          sed -i "s|PLACEHOLDER_GEMINI_KEY|${{ secrets.GEMINI_API_KEY }}|g" app.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
