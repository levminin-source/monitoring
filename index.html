<html lang="ru">
<head>
<meta charset="UTF-8">

<title>Мониторинг законодательства Q1 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f4f5f7; color: #1a1a2e; font-size: 14px; }

  /* Header */
  .header { background: #2F5496; color: #fff; padding: 18px 28px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 17px; font-weight: 600; letter-spacing: 0.01em; }
  .header .meta { font-size: 12px; opacity: 0.75; margin-top: 2px; }

  /* Tabs */
  .tabs { background: #fff; border-bottom: 1px solid #dde1ea; padding: 0 28px; display: flex; gap: 4px; }
  .tab { padding: 12px 18px; font-size: 13px; font-weight: 500; cursor: pointer; border-bottom: 3px solid transparent; color: #6b7280; white-space: nowrap; }
  .tab.active { border-bottom-color: #2F5496; color: #2F5496; }
  .tab:hover:not(.active) { color: #374151; }

  /* Toolbar */
  .toolbar { padding: 14px 28px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: #fff; border-bottom: 1px solid #eaecf0; }
  .toolbar input[type=text] { border: 1px solid #d1d5db; border-radius: 6px; padding: 7px 12px; font-size: 13px; width: 260px; outline: none; background: #f9fafb; }
  .toolbar input[type=text]:focus { border-color: #2F5496; background: #fff; }
  .filter-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .filter-label { font-size: 12px; color: #6b7280; margin-right: 2px; }
  .pill { padding: 5px 12px; border-radius: 20px; border: 1px solid #d1d5db; font-size: 12px; cursor: pointer; background: #fff; color: #374151; white-space: nowrap; }
  .pill.active { background: #2F5496; color: #fff; border-color: #2F5496; }
  .pill.crit-high.active  { background: #D5335D; border-color: #D5335D; }
  .pill.crit-med.active   { background: #140F39; border-color: #140F39; }
  .pill.crit-low.active   { background: #3B5B95; border-color: #3B5B95; }
  .count-badge { margin-left: auto; font-size: 12px; color: #6b7280; }

  /* Main content */
  .content { padding: 20px 28px; }

  /* Cards */
  .cards { display: flex; flex-direction: column; gap: 10px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; }
  .card-header { display: flex; align-items: flex-start; gap: 12px; padding: 14px 18px 12px; cursor: pointer; }
  .card-num { min-width: 28px; font-weight: 700; color: #374151; font-size: 13px; padding-top: 1px; }
  .card-title-block { flex: 1; }
  .card-category { font-size: 11px; color: #6b7280; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.04em; }
  .card-title { font-size: 13px; font-weight: 600; color: #111827; line-height: 1.4; }
  .card-meta { display: flex; gap: 8px; align-items: center; margin-top: 7px; flex-wrap: wrap; }
  .badge-crit { font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 12px; color: #fff; }
  .badge-crit.high { background: #D5335D; }
  .badge-crit.med  { background: #140F39; }
  .badge-crit.low  { background: #3B5B95; }
  .badge-dept { font-size: 11px; background: #eff6ff; color: #1d4ed8; padding: 2px 8px; border-radius: 12px; }
  .badge-date { font-size: 11px; background: #f3f4f6; color: #6b7280; padding: 2px 8px; border-radius: 12px; }
  .badge-status { font-size: 11px; background: #ecfdf5; color: #065f46; padding: 2px 8px; border-radius: 12px; }
  .card-chevron { font-size: 18px; color: #9ca3af; transition: transform 0.2s; flex-shrink: 0; margin-top: 2px; }
  .card.open .card-chevron { transform: rotate(180deg); }

  /* Card body */
  .card-body { display: none; padding: 0 18px 18px 58px; border-top: 1px solid #f3f4f6; }
  .card.open .card-body { display: block; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px; margin-top: 14px; }
  .detail-item label { font-size: 11px; color: #6b7280; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; display: block; margin-bottom: 4px; }
  .detail-item p { font-size: 13px; color: #374151; line-height: 1.55; white-space: pre-wrap; }
  .detail-item.full { grid-column: 1 / -1; }
  .detail-act { font-size: 12px; color: #2563eb; margin-top: 6px; font-style: italic; white-space: pre-wrap; }

  /* Sheet 2 - project changes */
  .proj-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; }
  .proj-card-header { padding: 14px 18px; cursor: pointer; display: flex; align-items: flex-start; gap: 12px; }
  .prob-badge { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 12px; background: #fef3c7; color: #92400e; white-space: nowrap; flex-shrink: 0; }
  .prob-badge.high { background: #dcfce7; color: #14532d; }
  .prob-badge.med  { background: #fef3c7; color: #92400e; }
  .prob-badge.low  { background: #f3f4f6; color: #4b5563; }

  /* Empty state */
  .empty { text-align: center; padding: 60px 20px; color: #9ca3af; }
  .empty svg { margin-bottom: 12px; }

  /* Stats bar */
  .stats-bar { display: flex; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .stat { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 16px; text-align: center; min-width: 90px; }
  .stat-val { font-size: 22px; font-weight: 700; color: #1a1a2e; }
  .stat-label { font-size: 11px; color: #6b7280; margin-top: 2px; }
  .stat.high .stat-val { color: #D5335D; }
  .stat.med  .stat-val { color: #140F39; }
  .stat.low  .stat-val { color: #3B5B95; }

  @media (max-width: 600px) {
    .detail-grid { grid-template-columns: 1fr; }
    .toolbar { flex-direction: column; align-items: flex-start; }
    .toolbar input[type=text] { width: 100%; }
    .content { padding: 14px 14px; }
    .card-body { padding-left: 18px; }
    .header, .tabs, .toolbar { padding-left: 14px; padding-right: 14px; }
  }
</style>
</head>

<div class="header">

    </div>
    <span class="count-badge" id="count-badge"></span>
  </div>
  <div class="content">

      <div class="stat med" ><div class="stat-val" id="cnt-med">0</div><div class="stat-label">Средняя</div></div>
      <div class="stat low" ><div class="stat-val" id="cnt-low">0</div><div class="stat-label">Низкая</div></div>
    </div>
    <div class="cards" id="cards-container"></div>
  </div>
</div>

<div id="tab-projects" style="display:none">

  </div>
  <div class="content">
    <div class="cards" id="proj-container"></div>
  </div>
</div>

let activeFilters = new Set();

function critClass(c) { return c === 'high' ? 'high' : c === 'med' ? 'med' : 'low'; }

function renderCards(items) {
  const container = document.getElementById('cards-container');
  container.innerHTML = '';
  items.forEach((d, i) => {
    const div = document.createElement('div');
    div.className = 'card';
    div.dataset.idx = i;
    div.innerHTML = `
      <div class="card-header" onclick="toggleCard(this)">
        <div class="card-num">${d.num}.</div>
        <div class="card-title-block">
          <div class="card-category">${d.category}</div>
          <div class="card-title">${d.title}</div>
          <div class="card-meta">
            <span class="badge-crit ${critClass(d.crit)}">${d.critLabel}</span>
            <span class="badge-dept">${d.dept}</span>
            <span class="badge-date">${d.date}</span>
            <span class="badge-status">${d.status}</span>
          </div>
        </div>
        <span class="card-chevron">&#8964;</span>
      </div>
      <div class="card-body">
        <div class="detail-grid">
          <div class="detail-item full">
            <label>Суть изменения</label>
            <p>${d.change}</p>
          </div>
          <div class="detail-item full">
            <label>Нормативный акт</label>
            <p class="detail-act">${d.act}</p>
          </div>
          <div class="detail-item">
            <label>Влияние на компанию</label>
            <p>${d.impact}</p>
          </div>
          <div class="detail-item">
            <label>Митигация риска</label>
            <p>${d.mitigation}</p>
          </div>
          <div class="detail-item">
            <label>Штрафные санкции</label>
            <p>${d.penalties}</p>
          </div>
          <div class="detail-item">
            <label>Срок адаптации</label>
            <p>${d.deadline}</p>
          </div>
        </div>
      </div>`;
    container.appendChild(div);
  });
  updateStats(items);
}

function renderProjects(items) {
  const container = document.getElementById('proj-container');
  container.innerHTML = '';
  items.forEach((d, i) => {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <div class="card-header" onclick="toggleCard(this)">
        <div style="flex:1">
          <div class="card-category">${d.category}</div>
          <div class="card-title">${d.title}</div>
          <div class="card-meta" style="margin-top:7px">
            <span class="prob-badge ${d.probLevel}">Вероятность: ${d.prob}</span>
            <span class="badge-dept">${d.dept}</span>
            <span class="badge-date">${d.planDate}</span>
          </div>
        </div>
        <span class="card-chevron">&#8964;</span>
      </div>
      <div class="card-body">
        <div class="detail-grid">
          <div class="detail-item full">

            <p>${d.change}</p>
          </div>

            <p class="detail-act">${d.act}</p>
          </div>
          <div class="detail-item">
            <label>Практическое значение</label>
            <p>${d.value}</p>
          </div>
          <div class="detail-item">
            <label>Дата обсуждения</label>
            <p>${d.discDate}</p>
          </div>
          <div class="detail-item full">
            <label>Комментарии</label>
            <p>${d.comments}</p>
          </div>
        </div>
      </div>`;
    container.appendChild(div);
  });
  document.getElementById('count-proj-badge').textContent = `Показано: ${items.length} из ${PROJECTS.length}`;
}

function toggleCard(header) {
  header.closest('.card').classList.toggle('open');
}

function updateStats(items) {
  const h = items.filter(d => d.crit === 'high').length;
  const m = items.filter(d => d.crit === 'med').length;
  const l = items.filter(d => d.crit === 'low').length;
  document.getElementById('cnt-high').textContent = h;
  document.getElementById('cnt-med').textContent  = m;
  document.getElementById('cnt-low').textContent  = l;
  document.getElementById('count-badge').textContent = `Показано: ${items.length} из ${DATA.length}`;
}

function toggleFilter(level) {
  const pill = document.querySelector(`.pill.crit-${level}`);
  if (activeFilters.has(level)) { activeFilters.delete(level); pill.classList.remove('active'); }
  else { activeFilters.add(level); pill.classList.add('active'); }
  filterCards();
}

function filterCards() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = DATA.filter(d => {
    const matchFilter = activeFilters.size === 0 || activeFilters.has(d.crit);
    const matchSearch = !q || [d.title, d.category, d.change, d.act, d.dept, d.impact].some(f => f.toLowerCase().includes(q));
    return matchFilter && matchSearch;
  });
  renderCards(filtered);
}

function filterProjects() {
  const q = document.getElementById('search-proj').value.toLowerCase();
  const filtered = PROJECTS.filter(d =>
    !q || [d.title, d.category, d.change, d.act, d.value].some(f => f.toLowerCase().includes(q))
  );
  renderProjects(filtered);
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-published').style.display = tab === 'published' ? '' : 'none';
  document.getElementById('tab-projects').style.display  = tab === 'projects'  ? '' : 'none';
  event.target.classList.add('active');
}

renderCards(DATA);
renderProjects(PROJECTS);
</script>
